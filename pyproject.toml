[project]
name = "glucose-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asitop>=0.0.24",
    "huggingface-hub>=0.30.0",
    "neuralforecast>=3",
    "numpy>=2.4.0",
    "nvitop>=1.5.3",
    "pandas>=2.0",
    "polars>=1.38.1",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "torch>=2.9.1",
    "transformers>=5.1.0",
    "typer>=0.15.0",
    "utilsforecast>=0.2.15",
]

[project.scripts]
train-glumind = "scripts.glumind.train_glumind:main"
evaluate-glumind = "scripts.glumind.evaluate_glumind:app"
inference-glumind = "scripts.glumind.inference_glumind:app"
download-glumind-hf = "scripts.glumind.download_from_huggingface:app"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
