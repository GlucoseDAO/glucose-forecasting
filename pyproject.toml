[project]
name = "glucose-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asitop>=0.0.24",
    "huggingface-hub>=0.30.0",
    "matplotlib>=3.10.0",
    "neuralforecast>=3.2.0",
    "numpy>=2.4.0",
    "nvitop>=1.5.3",
    "pandas>=2.0",
    "polars>=1.38.1",
    "pyarrow>=22.0.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "torch>=2.9.1",
    "transformers>=5.1.0",
    "truststore>=0.10.4",
    "typer>=0.15.0",
    "utilsforecast>=0.2.15",
]

[project.scripts]
glucose = "cli:app"
train-glumind = "glumind.train_glumind:main"
tune-sugar-one = "sugar_one.tune_sugar_one:app"
download-glumind-hf = "glumind.download_from_huggingface:app"
personal-prepare = "personalization.prepare:app"
personal-finetune = "personalization.finetune:app"
personal-tune = "personalization.tune:app"
personal-sweep-days = "personalization.sweep_data_size:app"
personal-sweep-lr = "personalization.sweep_holdout_lr:app"
personal-plot = "personalization.plots:app"
personal-sweep-lwf = "personalization.sweep_lwf:app"
personal-study = "personalization.study:app"
personal-nf-study = "personalization_nf.study:app"
personal-nf-adapt = "personalization_nf.adapt:app"
manuscript = "manuscript.cli:app"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/common",
    "src/glumind",
    "src/glumind_uni",
    "src/sugar_one",
    "src/sugar_jepa",
    "src/personalization",
    "src/personalization_nf",
    "src/nf_baselines",
    "src/manuscript",
]

[tool.hatch.build.targets.wheel.force-include]
"src/cli.py" = "cli.py"
"src/glucose_evaluate.yaml" = "glucose_evaluate.yaml"
"src/nf_baselines/model_suites.yaml" = "nf_baselines/model_suites.yaml"

# Use the OS TLS stack so PyPI/build deps resolve behind proxies or non-standard roots (Windows UnknownIssuer).
[tool.uv]
native-tls = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pypandoc-binary>=1.17",
    "pytest>=8.3",
    "tecto>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
