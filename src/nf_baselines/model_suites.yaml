version: 1
suites:
  auto:
    profiles: [ai-readi, loop]
    covariate_mode: historical-exogenous
    # xLSTM omitted from defaults (optional dep); pass --models xLSTM when installed
    models: [NHITS, NBEATSx, LSTM, TFT, TiDE]
  baseline:
    profiles: [ai-readi, loop]
    covariate_mode: univariate
    models: [NBEATS, NHITS, NBEATSx]
  recurrent:
    profiles: [ai-readi, loop]
    covariate_mode: historical-exogenous
    models: [LSTM, GRU, RNN]
