# Personalization fine-tune — Subject P1 + SugarOne (production defaults).
# Run:
#   uv run personal-prepare subject_p1
#   uv run personal-tune
#   uv run personal-tune --dry-run
#   uv run personal-tune --list
#
# Outputs in output_dir:
#   state.json       - every tried combo + status
#   leaderboard.csv  - sorted by ft_test_mae

[paths]
base_run_dir = "fixtures/checkpoints/sugar_one_1.0"
personal_csv = "data/input/personalization/prepared/subject_p1_chronological.csv"
output_dir = "data/output/runs/personalization/subject_p1/tune"

[defaults]
subject = "subject_p1"
lwf_lambda = 0.0
lr = 0.0004
weight_decay = 0.00003
epochs = 30
patience = 3
val_every_n_epochs = 2
batch_size = 256
train_window_stride = 6
seed = 43
device = "cuda"
precision = "bf16"
num_workers = -1
eval_zero_shot = true

[tune]
skip_completed = true

# Step-2 grid: LR only (3 combos). Plain fine-tune (lwf_lambda=0), wd fixed at 3e-5.
[grid]
lr = [0.0001, 0.0002, 0.0004]