# Full-data random search (e.g. overnight on workstation). Run:
#   uv run tune-glumind-ic -c scripts/glumind_ic/tune_glumind_ic_full.toml

[paths]
csv = "data/loop_and_ai_ready/loop_ai_ready_joined.csv"
output_dir = "runs/glumind_ic_tune/full"

[dataset]
unique_id = "sequence_id"
drop_interpolated = false
study_groups = ""
split_scheme = "classic"
max_train_series = 0
max_eval_series = 0

[defaults]
horizon = 12

[tune]
n_trials = 48
random_seed = 43
max_random_draws = 5000
resume_from = ""
epochs = 120
patience = 20
log_every = 1
val_every_n_epochs = 1
ckpt_every_n_epochs = 0
precision = "bf16"
compile_mode = "reduce-overhead"
disable_tf32 = false
num_workers = -1
prefetch_factor = 4
batch_log_every = 2000
eval_batch_log_every = 1000

[tune.space]
lr = [0.001, 0.0007, 0.0005]
weight_decay = [0.00001, 0.0001]
batch_size = [256, 1024, 4096]
d_model = [32, 64]
n_heads = [4, 8]
n_blocks = [2, 3, 4]
ff_units = [128, 256]
dropout = [0.05, 0.1, 0.15]
input_steps = [64, 80, 96]
horizon = 12
