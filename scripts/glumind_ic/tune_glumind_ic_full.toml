# Production GluMindIC training on full loop_ai_ready_joined2 data.
# Best hyperparameters from runs/glumind_ic_tune/explore_dev2/leaderboard.csv
# (trial 1, val_mae 18.35): n_blocks=5, input_steps=128, lr=0.0004, etc.
#
# Run (uses this file by default):
#   uv run tune-glumind-ic
#
# Laptop random search instead:
#   uv run tune-glumind-ic -c scripts/glumind_ic/tune_glumind_ic_dev.toml

[paths]
csv = "data/loop_and_ai_ready/loop_ai_ready_joined2.csv"
output_dir = "runs/glumind_ic_tune/production"

[dataset]
unique_id = "sequence_id"
drop_interpolated = false
study_groups = ""
split_scheme = "classic"
max_train_series = 0
max_eval_series = 0

[defaults]
d_model = 32
n_heads = 8
n_blocks = 5
ff_units = 128
dropout = 0.1
input_steps = 128
horizon = 12
lr = 0.0004
weight_decay = 0.00003
batch_size = 256

[tune]
n_trials = 1
random_seed = 43
max_random_draws = 1
resume_from = ""
epochs = 120
patience = 20
log_every = 1
val_every_n_epochs = 1
ckpt_every_n_epochs = 0
precision = "bf16"
compile_mode = "reduce-overhead"
disable_tf32 = false
num_workers = -1
prefetch_factor = 4
batch_log_every = 2000
eval_batch_log_every = 1000
